# Theme: colors are hex RGB. Fonts are files in assets/fonts (OFL licensed).
name = "default"

[colors]
background_top = "#0f1b3d"
background_bottom = "#3a0f4d"
background_accent = "#1d4f91"   # slow drifting glow
text = "#ffffff"
accent = "#ffd23f"              # highlighted caption word, progress bar, numbers
caption = "#ffffff"
caption_stroke = "#000000"
muted = "#c9c9e0"
particle = "#ffffff"

[fonts]
display = "BebasNeue-Regular.ttf"
display_weight = 0               # 0 = static font
body = "Montserrat-Variable.ttf"
body_weight = 800
small_weight = 600

[animation]
speed = 1.0                      # >1 = snappier text animations
particles = 36
