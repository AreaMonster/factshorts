# factshorts configuration.
# Every tunable lives here. Paths may be absolute or relative to this file.
# Never put API keys or remote LLM endpoints in here: `factshorts doctor` fails on them.

[general]
# Where work files, outputs, caches, logs and the database go.
# Empty = platform default (Windows: <SystemDrive>\factshorts-data, Linux: ~/.local/share/factshorts).
data_dir = ""
log_level = "INFO"

[ollama]
url = "http://127.0.0.1:11434"
# Use the largest model that fits your VRAM/RAM (see README). The judge should be a
# different model family than the writer so it doesn't share its blind spots.
writer_model = "qwen3:14b"
# gemma4:26b judged 10/10 on a labeled Everest test set; llama3.1:8b passed a wrong number.
judge_model = "gemma4:26b"
temperature = 0.4
num_ctx = 12288
timeout_s = 600
# Disable "thinking" output on models that support it (faster, cleaner JSON).
think = false

[wikipedia]
language = "en"
# Wikimedia asks for a descriptive User-Agent with contact info. Replace the placeholder.
user_agent = "factshorts/0.1 (local fact-video tool; contact: you@example.com)"
# Claims come from the lead plus this many following sections (best-maintained text).
max_sections = 3
# Plus up to this many later sections that best match the idea's keywords (e.g. "Visibility
# from space" for "Is the Great Wall visible from space?").
focus_sections = 2
skip_sections = ["See also", "References", "Notes", "External links", "Further reading", "Bibliography", "Sources", "Citations"]
search_limit = 5

[cache]
http_ttl_hours = 168

[script]
# Target seconds (20-180). TikTok Creator Rewards only pays for videos longer than 1 minute.
default_length = 75
default_tone = "neutral"     # neutral, funny, dramatic, kid-friendly
# Measured speaking rate of the voice (Kokoro am_michael: ~160 words per minute).
words_per_minute = 160
# Scene count follows the length (75 s / 9 ≈ 8 scenes of 2-3 sentences), within these bounds.
seconds_per_scene = 9.0
min_scenes = 4
max_scenes = 16
# Extra LLM calls that add scenes when a draft is too short or scenes fail fact-checking.
max_topups = 2
# After fact-checking, an editing pass smooths transitions and simplifies words. Edited scenes
# are verified again and only kept if they still pass.
polish = true
# Sentences that only repeat an earlier one in other words are removed when the NLI model says
# an earlier sentence entails them with at least this probability. 0 = exact repeats only.
repeat_entailment = 0.75
# Videos targeting 60 s or more are extended with extra scenes until the narration is at
# least this long (TikTok Creator Rewards only pays for videos longer than 1 minute).
min_duration_s = 62.0
max_json_retries = 3
# Narration may use at most this fraction above the word budget before it is rejected/retried.
budget_tolerance = 0.10
# The source text given to the LLM is cut to this many words (lead first).
max_source_words = 4000

[verification]
quote_check = true
entity_check = true
wikidata_check = true
nli_check = true
llm_judge = true
# Rounded numbers ("about 9,000") may deviate at most this much from the source value.
max_rounding_error = 0.05
# The writer sometimes mis-copies its quote. A near-copy (at least this similar, 0-100) is
# replaced by the exact source sentence; all checks then run against the real text. 0 = off.
snap_quote_min_ratio = 80
# Extra relative tolerance after unit conversion (e.g. ft -> m).
conversion_tolerance = 0.005
# Rounds of targeted scene rewrites before a failing scene is dropped (or the idea rejected).
max_rewrite_rounds = 3
# Before writing, check what the idea takes for granted; if the source contradicts it, the job
# waits for you (needs_input): make a corrected video or cancel.
premise_check = true
max_script_attempts = 3
require_review = true
# Local entailment model (CPU). The claim must be entailed by its quote/paragraph with at
# least this probability.
nli_model = "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
nli_device = "cpu"
nli_threshold = 0.5
# The LLM judge uses [ollama].judge_model (a different model family than the writer).

# Wikidata cross-check: a numeric/date claim about the article's subject that mentions one of
# these keywords must agree with the property's value(s). Add more as needed.
[verification.wikidata_properties.P2044]
label = "elevation above sea level"
keywords = ["tall", "high", "height", "elevation", "altitude", "above sea level", "summit"]
[verification.wikidata_properties.P2048]
label = "height"
keywords = ["tall", "high", "height"]
[verification.wikidata_properties.P2043]
label = "length"
keywords = ["long", "length"]
[verification.wikidata_properties.P2049]
label = "width"
keywords = ["wide", "width"]
[verification.wikidata_properties.P2386]
label = "diameter"
keywords = ["diameter", "across"]
[verification.wikidata_properties.P2120]
label = "radius"
keywords = ["radius"]
[verification.wikidata_properties.P4511]
label = "vertical depth"
keywords = ["deep", "depth"]
[verification.wikidata_properties.P2046]
label = "area"
keywords = ["area", "covers", "square"]
[verification.wikidata_properties.P1082]
label = "population"
keywords = ["population", "inhabitants", "residents", "people live"]
[verification.wikidata_properties.P2067]
label = "mass"
keywords = ["weigh", "weight", "mass", "heavy"]
[verification.wikidata_properties.P2583]
label = "distance from Earth"
keywords = ["from earth", "away from earth", "away from us"]
[verification.wikidata_properties.P571]
label = "inception"
keywords = ["founded", "built", "established", "created", "formed", "constructed", "completed"]
[verification.wikidata_properties.P569]
label = "date of birth"
keywords = ["born", "birth"]
[verification.wikidata_properties.P570]
label = "date of death"
keywords = ["died", "death"]
[verification.wikidata_properties.P575]
label = "time of discovery"
keywords = ["discovered", "discovery"]
[verification.wikidata_properties.P1619]
label = "date of official opening"
keywords = ["opened"]

[tts]
# kokoro (default, natural, Apache 2.0) or piper (fast fallback, more robotic)
engine = "kokoro"
# Kokoro voices: am_michael, am_fenrir, am_puck, af_heart, bm_george, bf_emma, ...
# (https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md)
voice = "am_michael"
speed = 1.0                  # Kokoro speaking speed
# Piper voice name from https://huggingface.co/rhasspy/piper-voices (only for engine = piper)
piper_voice = "en_US-ryan-high"
length_scale = 1.0           # Piper: >1 slower, <1 faster
sentence_pause_ms = 250
scene_pause_ms = 450
lead_in_ms = 150
tail_ms = 600
# Exact caption timing for voices without word timestamps (Piper), via local faster-whisper.
# Kokoro reports timestamps itself, so this only matters for engine = "piper".
use_whisper = true
whisper_model = "small.en"

# Spoken replacements for names the voice mispronounces.
[tts.pronunciations]
"Sagarmatha" = "Sah-gar-MAH-tah"
"Chomolungma" = "Choh-moh-LUNG-mah"

[render]
width = 1080
height = 1920
fps = 30
theme = "default"
# auto picks the first working of nvenc, amf, qsv, then libx264.
encoder = "auto"
# Parallel scene renderers; 0 = auto. Hardware encoders are capped by max_hw_sessions.
workers = 0
max_hw_sessions = 4
video_quality = 20           # CRF / CQ value, lower = better
audio_bitrate = "192k"
lufs_target = -14.0

[audio]
# Background music: files in assets/music (mp3/wav/ogg/flac, royalty-free!) are used when
# present; otherwise an original ambient pad is generated. The final mix is normalized to
# [render].lufs_target with two-pass loudnorm.
music = true
music_volume_db = -16.0
duck_threshold = 0.02   # the music ducks when the voice is louder than this
duck_ratio = 8.0

[visuals]
# parallax = AI illustration per scene + 3D depth camera move (default, ~10 min per video)
# hybrid   = like parallax, plus real AI motion (Wan 2.2) on a few scenes (~25 min;
#            judged not good enough in the Phase 1.5 review, kept as an option)
# wan      = AI motion on every scene (slow: ~50+ min)
# kenburns = illustration + simple pan/zoom (no depth model)
# off      = animated gradient background only (fast, no GPU needed)
mode = "parallax"
image_model = "Tongyi-MAI/Z-Image-Turbo"     # Apache 2.0
image_steps = 9
image_width = 768
image_height = 1344
depth_model = "depth-anything/Depth-Anything-V2-Small-hf"   # Apache 2.0
video_model = "Wan-AI/Wan2.2-TI2V-5B-Diffusers"            # Apache 2.0
wan_scenes = 4               # scenes that get real motion in hybrid mode
wan_include_hook = true      # always animate the first scene
wan_steps = 30
# Keep 480x832 on 16 GB GPUs: larger sizes overflow VRAM and get ~20x slower.
wan_width = 480
wan_height = 832
wan_frames = 81              # 4k+1 frames; 81 at 24 fps = 3.4 s of motion
wan_fps = 24
min_playback_speed = 0.55    # stretch short clips to fill a scene, down to this speed
crossfade_frames = 8
device = "cuda"
# A vision model (default: the judge model, gemma4:26b) looks at every illustration and the
# narration it belongs to; wrong pictures (e.g. a ringed planet for Venus) are redrawn.
review_images = true
review_model = ""
max_redraws = 2

[ideas]
# Topics for automatically generated ideas (`factshorts batch`, `factshorts make --topic`).
topics = ["space", "human body", "animals", "geography", "history", "technology", "Switzerland"]
per_topic = 2

[output]
# Relative paths resolve against data_dir.
dir = "output"

[web]
host = "127.0.0.1"
port = 8000
# argon2 hash; required for any non-localhost host.
password_hash = ""
