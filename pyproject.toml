[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factshorts"
version = "0.1.0"
description = "Local, free generator for fact-checked vertical short videos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.14",
    "httpx>=0.28",
    "typer>=0.27",
    "tomli-w>=1.0",
    "piper-tts>=1.8",
    "huggingface-hub>=2.4",
    "num2words>=0.5.14",
    "rapidfuzz>=3.14",
    "pillow>=13.0",
    "numpy>=2.4",
    # voice (Kokoro, Apache 2.0) and its English text frontend
    "kokoro>=0.9.4",
    "faster-whisper>=1.2",  # caption timing for voices without timestamps
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # AI visuals: Z-Image-Turbo, Depth Anything V2, Wan 2.2 (all Apache 2.0)
    "torch>=2.11",
    "diffusers>=0.42",
    "transformers>=5.0",
    "accelerate>=1.10",
    "ftfy>=6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

# NVIDIA GPUs: take PyTorch from the CUDA 13 index (RTX 50xx needs CUDA 12.8+).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
factshorts = "factshorts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/factshorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
markers = [
    "ffmpeg: needs a local ffmpeg/ffprobe binary (no network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode quotes/dashes are intentional test data
