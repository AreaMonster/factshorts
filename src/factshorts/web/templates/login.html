{% extends "base.html" %}
{% block title %}Log in · factshorts{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 3rem auto;">
  <h1>Log in</h1>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autofocus required>
    <p><button class="primary" type="submit">Log in</button></p>
  </form>
</div>
{% endblock %}
